services:
  - type: web
    name: roadvision-ai-hub
    env: python
    buildCommand: pip install -r requirements.txt && python app/generate_assets.py
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VISION_AI_AES_KEY
        generateValue: true
